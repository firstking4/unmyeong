  <style>
    :root {
      --bg: #f3eee6;
      --card: #faf7f2;
      --text: #1a1714;
      --muted: #6b6560;
      --tint: #b33a2e;
      --hairline: #ddd5c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 26rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
      text-align: center;
    }
    .icon {
      width: 5.5rem;
      height: 5.5rem;
      border-radius: 1.1rem;
      margin: 0 auto 1rem;
      display: block;
      box-shadow: 0 8px 24px rgba(26, 23, 20, 0.08);
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 1.75rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: 0.75rem;
      padding: 1.25rem 1rem;
      margin-bottom: 1rem;
      text-align: left;
    }
    .card h2 {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card ul {
      margin: 0;
      padding-left: 1.1rem;
      font-size: 0.92rem;
    }
    .card li { margin: 0.2rem 0; }
    .cta {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--tint);
      color: #faf7f2;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }
    .cta:active { opacity: 0.9; }
    .notice {
      display: none;
      margin-top: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--hairline);
      background: #fff;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }
    .notice strong {
      display: block;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }
    .platform-ios .android-only { display: none !important; }
    .platform-ios .ios-only { display: block !important; }
    .ios-only { display: none; }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .footer a { color: var(--tint); }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var root = document.documentElement;
      if (/iPhone|iPad|iPod/i.test(ua)) root.classList.add('platform-ios');
      else if (/Android/i.test(ua)) root.classList.add('platform-android');
      else root.classList.add('platform-other');
    })();
  </script>
