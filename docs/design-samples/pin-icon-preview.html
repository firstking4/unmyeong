<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>핀 아이콘 비교</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f5f3ed;
        font: 13px/1.5 -apple-system, system-ui, sans-serif;
        color: #1a1714;
      }
      .grid {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .cell {
        text-align: center;
        width: 124px;
      }
      .box {
        background: #fffcf8;
        border: 1px solid #e4ded4;
        border-radius: 12px;
        padding: 14px 0 10px;
      }
      .big {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 56px;
      }
      .small {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 28px;
      }
      .name {
        margin-top: 6px;
        font-weight: 600;
        font-size: 12px;
      }
      .label {
        margin-top: 4px;
        font-size: 12px;
        color: #8a8278;
      }
      img.ref {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="cell">
        <div class="box">
          <div class="big"><img class="ref" src="pin-reference.png" width="48" height="48" /></div>
          <div class="small"><img class="ref" src="pin-reference.png" width="16" height="16" /></div>
        </div>
        <div class="name">참고 이미지</div>
      </div>

      <div class="cell">
        <div class="box">
          <div class="big">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
              <g transform="rotate(45 12 12)">
                <path d="M12 17v5" stroke="#8a8278" stroke-width="1.8" stroke-linecap="round" />
                <path
                  d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                  stroke="#8a8278"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
          <div class="small">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <g transform="rotate(45 12 12)">
                <path d="M12 17v5" stroke="#8a8278" stroke-width="1.8" stroke-linecap="round" />
                <path
                  d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                  stroke="#8a8278"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
        </div>
        <div class="name">비활성</div>
        <div class="label">회색 선</div>
      </div>

      <div class="cell">
        <div class="box">
          <div class="big">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
              <g transform="rotate(45 12 12)">
                <path d="M12 17v5" stroke="#b23a2f" stroke-width="1.8" stroke-linecap="round" />
                <path
                  d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                  stroke="#b23a2f"
                  fill="#b23a2f"
                  fill-opacity="0.25"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
          <div class="small">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <g transform="rotate(45 12 12)">
                <path d="M12 17v5" stroke="#b23a2f" stroke-width="1.8" stroke-linecap="round" />
                <path
                  d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                  stroke="#b23a2f"
                  fill="#b23a2f"
                  fill-opacity="0.25"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
        </div>
        <div class="name">활성 (채택)</div>
        <div class="label">주홍 선 + 옅은 채움</div>
      </div>

      <div class="cell">
        <div class="box">
          <div class="big">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
              <g transform="rotate(45 12 12)">
                <path d="M12 17v5" stroke="#b23a2f" stroke-width="1.8" stroke-linecap="round" />
                <path
                  d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                  stroke="#b23a2f"
                  fill="#b23a2f"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
          <div class="small">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <g transform="rotate(45 12 12)">
                <path d="M12 17v5" stroke="#b23a2f" stroke-width="1.8" stroke-linecap="round" />
                <path
                  d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                  stroke="#b23a2f"
                  fill="#b23a2f"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
        </div>
        <div class="name">활성 (대안)</div>
        <div class="label">꽉 채움</div>
      </div>
    </div>
  </body>
</html>
